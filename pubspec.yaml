name: fatigue_guard
description: "Detecção de Sonolência ao Volante — app Flutter do TCC (EAR, MAR e PERCLOS com processamento 100% local)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.15.1
  wakelock_plus: ^1.2.8
  sqflite: ^2.4.5
  shared_preferences: ^2.5.6
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5

flutter:
  uses-material-design: true
