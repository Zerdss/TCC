name: fatigue_guard
description: "Detecção de Sonolência ao Volante — app Flutter do TCC (EAR, MAR e PERCLOS com processamento 100% local)."
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  camera: ^0.12.2
  google_mlkit_face_detection: ^0.15.1
  wakelock_plus: ^1.2.8
  sqflite: ^2.4.5
  shared_preferences: ^2.5.6
  path: ^1.9.1
  path_provider: ^2.1.6
  share_plus: ^13.3.1
  audioplayers: ^6.8.1
  vibration: ^3.2.1
  flutter_tts: ^4.2.5

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  sqflite_common_ffi: ^2.4.5
  flutter_launcher_icons: ^0.14.4
  flutter_native_splash: ^2.4.8

flutter:
  uses-material-design: true

  assets:
    - assets/sounds/

  fonts:
    # Títulos, rótulos e números (design_guidelines.json: displayFontFamily).
    - family: BarlowCondensed
      fonts:
        - asset: assets/fonts/BarlowCondensed-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/BarlowCondensed-Bold.ttf
          weight: 700
        - asset: assets/fonts/BarlowCondensed-ExtraBold.ttf
          weight: 800
    # Texto corrido (substitui a Satoshi, que não tem distribuição livre no Google Fonts).
    - family: Manrope
      fonts:
        - asset: assets/fonts/Manrope.ttf

# Ícone do app: dart run flutter_launcher_icons
flutter_launcher_icons:
  android: true
  ios: true
  image_path: assets/icon/icon.png
  adaptive_icon_background: "#F1F8F3"
  adaptive_icon_foreground: assets/icon/icon_foreground.png
  remove_alpha_ios: true
  min_sdk_android: 21

# Tela de abertura escura: dart run flutter_native_splash:create
flutter_native_splash:
  color: "#F1F8F3"
  image: assets/icon/icon_foreground.png
  android_12:
    color: "#F1F8F3"
    image: assets/icon/icon_foreground.png
    icon_background_color: "#F1F8F3"
