name: Flutter APK

# Gera o APK do app Flutter (flutter_app/) para instalar no celular Android.
# O arquivo fica disponível em "Actions" → execução → "Artifacts" → fatigue-guard-apk.
on:
  push:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'
  pull_request:
    paths:
      - 'flutter_app/**'
      - '.github/workflows/flutter-apk.yml'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: flutter_app
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fatigue-guard-apk
          path: flutter_app/build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30
