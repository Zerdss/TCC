name: Flutter APK e iOS

# Gera os instaladores do app Flutter:
# * fatigue-guard-apk  → APK para Android (instalar direto no celular);
# * fatigue-guard-ipa  → IPA para iPhone SEM assinatura (instalar com Sideloadly/AltStore
#   usando o seu Apple ID, que assina o app no momento da instalação).
# Os arquivos ficam em "Actions" → execução → "Artifacts".
on:
  push:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Análise estática
        run: flutter analyze

      - name: Testes
        run: flutter test

      - name: Gerar APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: fatigue-guard-apk
          path: build/app/outputs/flutter-apk/app-release.apk
          retention-days: 30

  ios:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Dependências
        run: flutter pub get

      - name: Compilar para iPhone (sem assinatura)
        run: flutter build ios --release --no-codesign

      - name: Empacotar IPA
        run: |
          mkdir -p build/ipa/Payload
          cp -R build/ios/iphoneos/Runner.app build/ipa/Payload/
          cd build/ipa && zip -qry FatigueGuard-unsigned.ipa Payload

      - uses: actions/upload-artifact@v4
        with:
          name: fatigue-guard-ipa
          path: build/ipa/FatigueGuard-unsigned.ipa
          retention-days: 30
